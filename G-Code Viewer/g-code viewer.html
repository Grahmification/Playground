<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D G-Code Toolpath Viewer & Material Removal Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #1a1a1a;
            color: #e0e0e0;
        }

        #sidebar {
            width: 330px;
            background-color: #252526;
            border-right: 1px solid #3c3c3c;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 12px;
            z-index: 10;
            overflow-y: auto;
        }

        h1 {
            font-size: 1.15rem;
            color: #ffffff;
            border-bottom: 1px solid #3c3c3c;
            padding-bottom: 8px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .control-group label {
            font-size: 0.8rem;
            color: #aaaaaa;
        }

        .input-row {
            display: flex;
            gap: 6px;
        }

        .input-row input {
            width: 33.33%;
        }

        select, input[type="range"], input[type="number"] {
            width: 100%;
            padding: 6px;
            background-color: #1e1e1e;
            color: #e0e0e0;
            border: 1px solid #3c3c3c;
            border-radius: 4px;
            font-size: 0.85rem;
            outline: none;
        }

        select:focus, input[type="number"]:focus {
            border-color: #0e639c;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 9px;
            background-color: #0e639c;
            color: white;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            border: none;
            transition: background 0.2s;
            font-size: 0.85rem;
        }

        .btn:hover {
            background-color: #1177bb;
        }

        .btn-secondary {
            background-color: #3c3c3c;
            padding: 7px;
            font-size: 0.8rem;
        }

        .btn-secondary:hover {
            background-color: #505050;
        }

        .btn-row {
            display: flex;
            gap: 6px;
        }

        .panel {
            background-color: #1e1e1e;
            border-radius: 4px;
            padding: 10px;
            border: 1px solid #3c3c3c;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .panel-title {
            font-weight: 600;
            color: #ffffff;
            border-bottom: 1px solid #2a2a2a;
            padding-bottom: 4px;
            margin-bottom: 2px;
            font-size: 0.85rem;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
        }

        .stats-value {
            color: #4ec9b0;
            font-family: monospace;
        }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.8rem;
            background-color: #1e1e1e;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #3c3c3c;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-box {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        .heatmap-bar {
            height: 10px;
            border-radius: 2px;
            background: linear-gradient(to right, #0000ff, #00ffff, #00ff00, #ffff00, #ff0000);
            width: 100%;
        }

        #viewport {
            flex-grow: 1;
            position: relative;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 16px 24px;
            border-radius: 8px;
            display: none;
            color: #fff;
            font-weight: 500;
            text-align: center;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="sidebar">
        <h1>G-Code Visualizer & Simulator</h1>
        
        <div class="file-input-wrapper">
            <label for="gcode-file" class="btn">Open G-Code File</label>
            <input type="file" id="gcode-file" accept=".gcode,.nc,.cnc,.tap,.txt">
        </div>

        <div class="control-group">
            <label for="color-mode">Color Mode</label>
            <select id="color-mode">
                <option value="type">Motion Type (G0/G1/G2/G3)</option>
                <option value="feedrate">Feed Rate Heatmap</option>
            </select>
        </div>

        <div id="legend-container"></div>

        <!-- Stock Setup Panel -->
        <div class="panel">
            <div class="panel-title">Stock Setup</div>
            <div class="control-group">
                <label>Dimensions X, Y, Z (mm)</label>
                <div class="input-row">
                    <input type="number" id="stock-x" placeholder="X" min="1" step="1" value="100">
                    <input type="number" id="stock-y" placeholder="Y" min="1" step="1" value="100">
                    <input type="number" id="stock-z" placeholder="Z" min="1" step="1" value="20">
                </div>
            </div>
            <div class="control-group">
                <label>Origin Min X, Y, Z (mm)</label>
                <div class="input-row">
                    <input type="number" id="stock-orig-x" placeholder="Min X" step="1" value="0">
                    <input type="number" id="stock-orig-y" placeholder="Min Y" step="1" value="0">
                    <input type="number" id="stock-orig-z" placeholder="Min Z" step="1" value="-20">
                </div>
            </div>
            <div class="btn-row">
                <button id="btn-apply-stock" class="btn btn-secondary">Apply Stock</button>
                <button id="btn-auto-stock" class="btn btn-secondary">Auto-Fit to Path</button>
            </div>
        </div>

        <!-- Simulation Controls Panel -->
        <div class="panel">
            <div class="panel-title">Simulation Controls</div>
            <div class="btn-row">
                <button id="btn-play" class="btn btn-secondary">Play</button>
                <button id="btn-reset" class="btn btn-secondary">Reset</button>
            </div>
            <div class="control-group">
                <label for="tool-diameter">Tool Diameter (mm)</label>
                <input type="number" id="tool-diameter" placeholder="e.g. 6" min="0.1" step="0.1" value="6">
            </div>
            <div class="control-group">
                <label for="sim-speed">Simulation Speed</label>
                <select id="sim-speed">
                    <option value="0.5">0.5x Speed</option>
                    <option value="1" selected>1x Real-time</option>
                    <option value="5">5x Speed</option>
                    <option value="10">10x Speed</option>
                    <option value="50">50x Speed</option>
                </select>
            </div>
            <div class="control-group">
                <label for="sim-progress">Progress</label>
                <input type="range" id="sim-progress" min="0" max="100" value="0" step="0.1">
            </div>
            <div class="stats-row"><span>Current Feed:</span> <span id="sim-feed" class="stats-value">0 mm/min</span></div>
            <div class="stats-row"><span>Tool Pos:</span> <span id="sim-pos" class="stats-value">X0 Y0 Z0</span></div>
        </div>

        <div class="panel">
            <div class="panel-title">File Information</div>
            <div class="stats-row"><span>Status:</span> <span id="status" class="stats-value">Idle</span></div>
            <div class="stats-row"><span>Commands:</span> <span id="line-count" class="stats-value">0</span></div>
            <div class="stats-row"><span>Min Feed:</span> <span id="feed-min" class="stats-value">0 mm/min</span></div>
            <div class="stats-row"><span>Max Feed:</span> <span id="feed-max" class="stats-value">0 mm/min</span></div>
            <div class="stats-row"><span>X Size:</span> <span id="dim-x" class="stats-value">0.00 mm</span></div>
            <div class="stats-row"><span>Y Size:</span> <span id="dim-y" class="stats-value">0.00 mm</span></div>
            <div class="stats-row"><span>Z Size:</span> <span id="dim-z" class="stats-value">0.00 mm</span></div>
        </div>
    </div>

    <div id="viewport">
        <div id="canvas-container"></div>
        <div id="loading">Parsing G-code...</div>
    </div>

    <script>
        // --- 3D Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1e1e1e);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 10000);
        camera.position.set(150, -150, 120);
        camera.up.set(0, 0, 1);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Enhanced Ambient & Directional Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
        scene.add(ambientLight);

        const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight1.position.set(200, -200, 300);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.5);
        dirLight2.position.set(-200, 200, -100);
        scene.add(dirLight2);

        const gridHelper = new THREE.GridHelper(200, 50, 0x666666, 0x333333);
        gridHelper.rotation.x = Math.PI / 2;
        scene.add(gridHelper);

        let toolpathGroup = new THREE.Group();
        scene.add(toolpathGroup);

        // --- Tool Mesh setup ---
        const toolMaterial = new THREE.MeshStandardMaterial({ 
            color: 0xff3300, 
            roughness: 0.2,
            metalness: 0.8
        });
        
        let toolMesh = new THREE.Mesh(new THREE.BufferGeometry(), toolMaterial);
        toolMesh.visible = false;
        scene.add(toolMesh);

        // --- Data & Simulation State ---
        let parsedSegments = [];
        let minFeed = Infinity;
        let maxFeed = -Infinity;
        let bounds = { minX: Infinity, maxX: -Infinity, minY: Infinity, maxY: -Infinity, minZ: Infinity, maxZ: -Infinity };

        let totalPathLength = 0;
        let isSimulating = false;
        let currentDistance = 0;
        let lastTimestamp = null;
        let currentToolDiameter = 6;
        const DEFAULT_RAPID_FEED = 5000;

        // --- Stock Removal Voxel System ---
        let voxelInstancedMesh = null;
        let stockParams = null;
        let voxelGrid = null;
        let voxelsX = 0, voxelsY = 0, voxelsZ = 0;
        let voxelSize = 1;
        
        const dummyPos = new THREE.Vector3();
        const dummyScale = new THREE.Vector3(1, 1, 1);
        const dummyRot = new THREE.Quaternion(0, 0, 0, 1);
        const matrixDummy = new THREE.Matrix4();
        const zeroScale = new THREE.Vector3(0, 0, 0);

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        // Animation Loop
        function animate(timestamp) {
            requestAnimationFrame(animate);

            if (isSimulating && parsedSegments.length > 0) {
                if (!lastTimestamp) lastTimestamp = timestamp;
                const deltaSeconds = (timestamp - lastTimestamp) / 1000;
                lastTimestamp = timestamp;

                updateSimulationStep(deltaSeconds);
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- UI Listeners ---
        document.getElementById('color-mode').addEventListener('change', () => {
            renderToolpath();
            updateLegend();
        });

        document.getElementById('tool-diameter').addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            currentToolDiameter = (!isNaN(val) && val > 0) ? val : null;
            updateToolGeometry();
            if (parsedSegments.length > 0) {
                updateToolPositionByDistance(currentDistance);
            }
        });

        document.getElementById('btn-apply-stock').addEventListener('click', applyStockFromUI);
        document.getElementById('btn-auto-stock').addEventListener('click', autoFitStockToPath);

        document.getElementById('gcode-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('status').innerText = 'Loading...';

            const reader = new FileReader();
            reader.onload = function(evt) {
                parseGCode(evt.target.result);
                renderToolpath();
                updateLegend();
                fitCameraToBounds();
                applyStockFromUI();
                resetSimulation();
                document.getElementById('loading').style.display = 'none';
                document.getElementById('status').innerText = 'Loaded';
            };
            reader.readAsText(file);
        });

        const btnPlay = document.getElementById('btn-play');
        const btnReset = document.getElementById('btn-reset');
        const progressSlider = document.getElementById('sim-progress');

        btnPlay.addEventListener('click', () => {
            if (parsedSegments.length === 0) return;
            isSimulating = !isSimulating;
            btnPlay.innerText = isSimulating ? 'Pause' : 'Play';
            lastTimestamp = null;
        });

        btnReset.addEventListener('click', resetSimulation);

        progressSlider.addEventListener('input', (e) => {
            if (parsedSegments.length === 0) return;
            const targetPct = parseFloat(e.target.value) / 100;
            const targetDist = targetPct * totalPathLength;

            if (targetDist < currentDistance) {
                rebuildStockUpToDistance(targetDist);
            } else {
                subtractStockBetween(currentDistance, targetDist);
            }

            currentDistance = targetDist;
            updateToolPositionByDistance(currentDistance);
        });

        // --- Tool Mesh Builder ---
        function updateToolGeometry() {
            toolMesh.geometry.dispose();

            if (currentToolDiameter) {
                const radius = currentToolDiameter / 2;
                const height = currentToolDiameter * 3;
                
                const geom = new THREE.CylinderGeometry(radius, radius, height, 32);
                geom.rotateX(Math.PI / 2);
                geom.translate(0, 0, height / 2);
                
                toolMesh.geometry = geom;
            } else {
                const maxDim = (bounds.minX !== Infinity && !isNaN(bounds.minX)) ? Math.max(
                    bounds.maxX - bounds.minX,
                    bounds.maxY - bounds.minY,
                    bounds.maxZ - bounds.minZ
                ) : 50;
                const radius = Math.max(maxDim * 0.012, 0.5);
                toolMesh.geometry = new THREE.SphereGeometry(radius, 16, 16);
            }
        }

        // --- Stock Removal Voxel Engine ---
        function applyStockFromUI() {
            const dx = parseFloat(document.getElementById('stock-x').value);
            const dy = parseFloat(document.getElementById('stock-y').value);
            const dz = parseFloat(document.getElementById('stock-z').value);

            const ox = parseFloat(document.getElementById('stock-orig-x').value);
            const oy = parseFloat(document.getElementById('stock-orig-y').value);
            const oz = parseFloat(document.getElementById('stock-orig-z').value);

            if (isNaN(dx) || isNaN(dy) || isNaN(dz) || dx <= 0 || dy <= 0 || dz <= 0) {
                clearStock();
                return;
            }

            stockParams = {
                dimX: dx, dimY: dy, dimZ: dz,
                origX: isNaN(ox) ? 0 : ox,
                origY: isNaN(oy) ? 0 : oy,
                origZ: isNaN(oz) ? -dz : oz
            };

            initStockVoxels();
            resetSimulation();
        }

        function autoFitStockToPath() {
            if (bounds.minX === Infinity) return;

            const padding = 5;
            const dx = Math.ceil((bounds.maxX - bounds.minX) + padding * 2);
            const dy = Math.ceil((bounds.maxY - bounds.minY) + padding * 2);
            const dz = Math.ceil((bounds.maxZ - bounds.minZ) + padding * 2);

            const ox = Math.floor(bounds.minX - padding);
            const oy = Math.floor(bounds.minY - padding);
            const oz = Math.floor(bounds.minZ - padding);

            document.getElementById('stock-x').value = dx;
            document.getElementById('stock-y').value = dy;
            document.getElementById('stock-z').value = dz;

            document.getElementById('stock-orig-x').value = ox;
            document.getElementById('stock-orig-y').value = oy;
            document.getElementById('stock-orig-z').value = oz;

            applyStockFromUI();
        }

        function clearStock() {
            if (voxelInstancedMesh) {
                scene.remove(voxelInstancedMesh);
                voxelInstancedMesh.geometry.dispose();
                voxelInstancedMesh.material.dispose();
                voxelInstancedMesh = null;
            }
            stockParams = null;
            voxelGrid = null;
        }

        function initStockVoxels() {
            clearStock();
            if (!stockParams) return;

            const targetResolution = 35;
            const maxDim = Math.max(stockParams.dimX, stockParams.dimY, stockParams.dimZ);
            voxelSize = Math.max(1.0, maxDim / targetResolution);

            voxelsX = Math.ceil(stockParams.dimX / voxelSize);
            voxelsY = Math.ceil(stockParams.dimY / voxelSize);
            voxelsZ = Math.ceil(stockParams.dimZ / voxelSize);

            const totalVoxels = voxelsX * voxelsY * voxelsZ;
            voxelGrid = new Uint8Array(totalVoxels);
            voxelGrid.fill(1);

            const geom = new THREE.BoxGeometry(voxelSize * 0.98, voxelSize * 0.98, voxelSize * 0.98);
            
            // High visibility material
            const mat = new THREE.MeshStandardMaterial({
                color: 0xd9a752,
                roughness: 0.4,
                metalness: 0.1,
                side: THREE.DoubleSide
            });

            voxelInstancedMesh = new THREE.InstancedMesh(geom, mat, totalVoxels);
            voxelInstancedMesh.frustumCulled = false; // Prevents Three.js from dropping stock visibility

            let idx = 0;
            for (let ix = 0; ix < voxelsX; ix++) {
                for (let iy = 0; iy < voxelsY; iy++) {
                    for (let iz = 0; iz < voxelsZ; iz++) {
                        dummyPos.set(
                            stockParams.origX + (ix + 0.5) * voxelSize,
                            stockParams.origY + (iy + 0.5) * voxelSize,
                            stockParams.origZ + (iz + 0.5) * voxelSize
                        );

                        matrixDummy.compose(dummyPos, dummyRot, dummyScale);
                        voxelInstancedMesh.setMatrixAt(idx++, matrixDummy);
                    }
                }
            }

            voxelInstancedMesh.instanceMatrix.needsUpdate = true;
            scene.add(voxelInstancedMesh);
        }

        function subtractToolVolume(toolPos) {
            if (!voxelGrid || !stockParams || !currentToolDiameter) return;

            const toolRadius = currentToolDiameter / 2;
            const toolHeight = currentToolDiameter * 3;

            const minIx = Math.max(0, Math.floor((toolPos.x - toolRadius - stockParams.origX) / voxelSize));
            const maxIx = Math.min(voxelsX - 1, Math.ceil((toolPos.x + toolRadius - stockParams.origX) / voxelSize));

            const minIy = Math.max(0, Math.floor((toolPos.y - toolRadius - stockParams.origY) / voxelSize));
            const maxIy = Math.min(voxelsY - 1, Math.ceil((toolPos.y + toolRadius - stockParams.origY) / voxelSize));

            const minIz = Math.max(0, Math.floor((toolPos.z - stockParams.origZ) / voxelSize));
            const maxIz = Math.min(voxelsZ - 1, Math.ceil((toolPos.z + toolHeight - stockParams.origZ) / voxelSize));

            let modified = false;

            for (let ix = minIx; ix <= maxIx; ix++) {
                const vx = stockParams.origX + (ix + 0.5) * voxelSize;
                const dx = vx - toolPos.x;

                for (let iy = minIy; iy <= maxIy; iy++) {
                    const vy = stockParams.origY + (iy + 0.5) * voxelSize;
                    const dy = vy - toolPos.y;

                    if ((dx * dx + dy * dy) <= (toolRadius * toolRadius)) {
                        for (let iz = minIz; iz <= maxIz; iz++) {
                            const vz = stockParams.origZ + (iz + 0.5) * voxelSize;

                            if (vz >= toolPos.z && vz <= toolPos.z + toolHeight) {
                                const idx = ix * (voxelsY * voxelsZ) + iy * voxelsZ + iz;
                                if (voxelGrid[idx] === 1) {
                                    voxelGrid[idx] = 0;

                                    dummyPos.set(
                                        stockParams.origX + (ix + 0.5) * voxelSize,
                                        stockParams.origY + (iy + 0.5) * voxelSize,
                                        stockParams.origZ + (iz + 0.5) * voxelSize
                                    );
                                    
                                    matrixDummy.compose(dummyPos, dummyRot, zeroScale);
                                    voxelInstancedMesh.setMatrixAt(idx, matrixDummy);
                                    modified = true;
                                }
                            }
                        }
                    }
                }
            }

            if (modified) {
                voxelInstancedMesh.instanceMatrix.needsUpdate = true;
            }
        }

        function subtractStockBetween(startDist, endDist) {
            if (!voxelGrid || !currentToolDiameter || parsedSegments.length === 0) return;

            const stepSize = Math.max(currentToolDiameter * 0.3, 0.5);
            let dist = startDist;

            while (dist < endDist) {
                dist = Math.min(dist + stepSize, endDist);
                const seg = getCurrentSegment(dist);
                if (seg && seg.motion !== 'G0') {
                    const segProgress = (dist - seg.startDist) / seg.length;
                    const t = Math.min(Math.max(segProgress, 0), 1);

                    const pos = {
                        x: seg.start[0] + t * (seg.end[0] - seg.start[0]),
                        y: seg.start[1] + t * (seg.end[1] - seg.start[1]),
                        z: seg.start[2] + t * (seg.end[2] - seg.start[2])
                    };

                    subtractToolVolume(pos);
                }
            }
        }

        function rebuildStockUpToDistance(targetDist) {
            if (!stockParams) return;
            initStockVoxels();
            subtractStockBetween(0, targetDist);
        }

        // --- G-Code Parser ---
        function parseGCode(text) {
            parsedSegments = [];
            minFeed = Infinity;
            maxFeed = -Infinity;
            totalPathLength = 0;

            const lines = text.split('\n');
            document.getElementById('line-count').innerText = lines.length.toLocaleString();

            let currentPos = { x: 0, y: 0, z: 0 };
            let relativeMode = false;
            let currentMotion = 'G0';
            let currentFeed = 0;

            bounds = {
                minX: Infinity, maxX: -Infinity,
                minY: Infinity, maxY: -Infinity,
                minZ: Infinity, maxZ: -Infinity
            };

            function updateBounds(x, y, z) {
                bounds.minX = Math.min(bounds.minX, x);
                bounds.maxX = Math.max(bounds.maxX, x);
                bounds.minY = Math.min(bounds.minY, y);
                bounds.maxY = Math.max(bounds.maxY, y);
                bounds.minZ = Math.min(bounds.minZ, z);
                bounds.maxZ = Math.max(bounds.maxZ, z);
            }

            lines.forEach(line => {
                line = line.replace(/\(.*?\)/g, '').replace(/;.*/, '').trim().toUpperCase();
                if (!line) return;

                const tokens = line.split(/\s+/);
                let target = { ...currentPos };
                let arcIJ = { i: 0, j: 0 };
                let hasMove = false;

                tokens.forEach(token => {
                    const cmd = token[0];
                    const val = parseFloat(token.substring(1));

                    if (cmd === 'G') {
                        if (val === 0) currentMotion = 'G0';
                        else if (val === 1) currentMotion = 'G1';
                        else if (val === 2) currentMotion = 'G2';
                        else if (val === 3) currentMotion = 'G3';
                        else if (val === 90) relativeMode = false;
                        else if (val === 91) relativeMode = true;
                    } else if (cmd === 'F') {
                        currentFeed = val;
                    } else if (cmd === 'X') {
                        target.x = relativeMode ? currentPos.x + val : val;
                        hasMove = true;
                    } else if (cmd === 'Y') {
                        target.y = relativeMode ? currentPos.y + val : val;
                        hasMove = true;
                    } else if (cmd === 'Z') {
                        target.z = relativeMode ? currentPos.z + val : val;
                        hasMove = true;
                    } else if (cmd === 'I') arcIJ.i = val;
                    else if (cmd === 'J') arcIJ.j = val;
                });

                if (hasMove || currentMotion === 'G2' || currentMotion === 'G3') {
                    const start = [currentPos.x, currentPos.y, currentPos.z];

                    if (currentMotion !== 'G0' && currentFeed > 0) {
                        minFeed = Math.min(minFeed, currentFeed);
                        maxFeed = Math.max(maxFeed, currentFeed);
                    }

                    if (currentMotion === 'G0' || currentMotion === 'G1') {
                        const targetPos = [target.x, target.y, target.z];
                        const segDist = Math.hypot(
                            targetPos[0] - start[0],
                            targetPos[1] - start[1],
                            targetPos[2] - start[2]
                        );

                        if (segDist > 0) {
                            parsedSegments.push({
                                start,
                                end: targetPos,
                                motion: currentMotion,
                                feedrate: currentFeed,
                                length: segDist,
                                startDist: totalPathLength
                            });
                            totalPathLength += segDist;
                        }

                        updateBounds(start[0], start[1], start[2]);
                        updateBounds(targetPos[0], targetPos[1], targetPos[2]);
                    } 
                    else if (currentMotion === 'G2' || currentMotion === 'G3') {
                        const isCW = currentMotion === 'G2';
                        let centerX = currentPos.x + arcIJ.i;
                        let centerY = currentPos.y + arcIJ.j;

                        let startAngle = Math.atan2(currentPos.y - centerY, currentPos.x - centerX);
                        let endAngle = Math.atan2(target.y - centerY, target.x - centerX);

                        if (isCW && endAngle >= startAngle) endAngle -= 2 * Math.PI;
                        if (!isCW && endAngle <= startAngle) endAngle += 2 * Math.PI;

                        const segments = 16;
                        let prevPt = [currentPos.x, currentPos.y, currentPos.z];

                        for (let step = 1; step <= segments; step++) {
                            const t = step / segments;
                            const angle = startAngle + t * (endAngle - startAngle);
                            const interpolatedZ = currentPos.z + t * (target.z - currentPos.z);
                            const nextPt = [
                                centerX + Math.cos(angle) * Math.hypot(arcIJ.i, arcIJ.j),
                                centerY + Math.sin(angle) * Math.hypot(arcIJ.i, arcIJ.j),
                                interpolatedZ
                            ];

                            const segDist = Math.hypot(
                                nextPt[0] - prevPt[0],
                                nextPt[1] - prevPt[1],
                                nextPt[2] - prevPt[2]
                            );

                            if (segDist > 0) {
                                parsedSegments.push({
                                    start: prevPt,
                                    end: nextPt,
                                    motion: currentMotion,
                                    feedrate: currentFeed,
                                    length: segDist,
                                    startDist: totalPathLength
                                });
                                totalPathLength += segDist;
                            }

                            updateBounds(nextPt[0], nextPt[1], nextPt[2]);
                            prevPt = nextPt;
                        }
                    }

                    currentPos = { ...target };
                }
            });

            updateToolGeometry();

            document.getElementById('feed-min').innerText = minFeed === Infinity ? '0 mm/min' : `${minFeed} mm/min`;
            document.getElementById('feed-max').innerText = maxFeed === -Infinity ? '0 mm/min' : `${maxFeed} mm/min`;
        }

        // --- Simulation Execution ---
        function updateSimulationStep(deltaSeconds) {
            const previousDistance = currentDistance;

            const currentSeg = getCurrentSegment(currentDistance);
            if (!currentSeg) {
                isSimulating = false;
                btnPlay.innerText = 'Play';
                return;
            }

            let effectiveFeed = currentSeg.feedrate;
            if (currentSeg.motion === 'G0' || effectiveFeed <= 0) {
                effectiveFeed = maxFeed > 0 ? maxFeed * 1.5 : DEFAULT_RAPID_FEED;
            }

            const speedMultiplier = parseFloat(document.getElementById('sim-speed').value);
            const mmPerSec = (effectiveFeed / 60) * speedMultiplier;
            currentDistance += mmPerSec * deltaSeconds;

            if (currentDistance >= totalPathLength) {
                currentDistance = totalPathLength;
                isSimulating = false;
                btnPlay.innerText = 'Play';
            }

            subtractStockBetween(previousDistance, currentDistance);
            updateToolPositionByDistance(currentDistance);
        }

        function getCurrentSegment(dist) {
            if (parsedSegments.length === 0) return null;
            for (let i = 0; i < parsedSegments.length; i++) {
                const seg = parsedSegments[i];
                if (dist >= seg.startDist && dist <= seg.startDist + seg.length) {
                    return seg;
                }
            }
            return parsedSegments[parsedSegments.length - 1];
        }

        function updateToolPositionByDistance(dist) {
            if (parsedSegments.length === 0) return;

            const seg = getCurrentSegment(dist);
            const segProgress = (dist - seg.startDist) / seg.length;
            const t = Math.min(Math.max(segProgress, 0), 1);

            const posX = seg.start[0] + t * (seg.end[0] - seg.start[0]);
            const posY = seg.start[1] + t * (seg.end[1] - seg.start[1]);
            const posZ = seg.start[2] + t * (seg.end[2] - seg.start[2]);

            toolMesh.position.set(posX, posY, posZ);
            toolMesh.visible = true;

            const pct = (dist / totalPathLength) * 100;
            progressSlider.value = pct.toFixed(1);

            const activeFeed = seg.motion === 'G0' ? 'RAPID' : `${seg.feedrate} mm/min`;
            document.getElementById('sim-feed').innerText = activeFeed;
            document.getElementById('sim-pos').innerText = `X${posX.toFixed(1)} Y${posY.toFixed(1)} Z${posZ.toFixed(1)}`;
        }

        function resetSimulation() {
            isSimulating = false;
            btnPlay.innerText = 'Play';
            currentDistance = 0;

            if (stockParams) {
                initStockVoxels();
            }

            if (parsedSegments.length > 0) {
                updateToolPositionByDistance(0);
            } else {
                toolMesh.visible = false;
            }
        }

        // --- Render Toolpath Mesh ---
        function renderToolpath() {
            while (toolpathGroup.children.length > 0) {
                const child = toolpathGroup.children[0];
                child.geometry.dispose();
                child.material.dispose();
                toolpathGroup.remove(child);
            }

            if (parsedSegments.length === 0) return;

            const colorMode = document.getElementById('color-mode').value;

            if (colorMode === 'type') {
                const rapidPositions = [];
                const linearPositions = [];
                const arcPositions = [];

                parsedSegments.forEach(seg => {
                    const pts = [...seg.start, ...seg.end];
                    if (seg.motion === 'G0') rapidPositions.push(...pts);
                    else if (seg.motion === 'G1') linearPositions.push(...pts);
                    else if (seg.motion === 'G2' || seg.motion === 'G3') arcPositions.push(...pts);
                });

                createLineMesh(rapidPositions, 0xff2a2a);   // Red
                createLineMesh(linearPositions, 0x0088ff);  // Blue
                createLineMesh(arcPositions, 0x00ff88);     // Green
            } 
            else if (colorMode === 'feedrate') {
                const positions = [];
                const colors = [];
                const c = new THREE.Color();

                const validMinFeed = minFeed === Infinity ? 0 : minFeed;
                const validMaxFeed = maxFeed === -Infinity ? 1 : maxFeed;
                const feedRange = Math.max(validMaxFeed - validMinFeed, 1);

                parsedSegments.forEach(seg => {
                    positions.push(...seg.start, ...seg.end);

                    if (seg.motion === 'G0') {
                        c.setHex(0x555555);
                    } else {
                        const t = Math.min(Math.max((seg.feedrate - validMinFeed) / feedRange, 0), 1);
                        const hue = (1 - t) * 0.666;
                        c.setHSL(hue, 1.0, 0.5);
                    }

                    colors.push(c.r, c.g, c.b, c.r, c.g, c.b);
                });

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

                const material = new THREE.LineBasicMaterial({ vertexColors: true, linewidth: 1 });
                const lineSegments = new THREE.LineSegments(geometry, material);
                toolpathGroup.add(lineSegments);
            }
        }

        function createLineMesh(positions, color) {
            if (positions.length === 0) return;
            const geometry = new THREE.BufferGeometry();
            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            const material = new THREE.LineBasicMaterial({ color: color, linewidth: 1 });
            const lineSegments = new THREE.LineSegments(geometry, material);
            toolpathGroup.add(lineSegments);
        }

        function updateLegend() {
            const container = document.getElementById('legend-container');
            const colorMode = document.getElementById('color-mode').value;

            if (colorMode === 'type') {
                container.innerHTML = `
                    <div class="legend">
                        <div class="legend-item">
                            <div class="color-box" style="background-color: #ff2a2a;"></div>
                            <span>Rapid Move (G0)</span>
                        </div>
                        <div class="legend-item">
                            <div class="color-box" style="background-color: #0088ff;"></div>
                            <span>Linear Cutting (G1)</span>
                        </div>
                        <div class="legend-item">
                            <div class="color-box" style="background-color: #00ff88;"></div>
                            <span>Arc Cutting (G2 / G3)</span>
                        </div>
                    </div>
                `;
            } else {
                const displayMin = minFeed === Infinity ? 0 : minFeed;
                const displayMax = maxFeed === -Infinity ? 0 : maxFeed;
                container.innerHTML = `
                    <div class="legend">
                        <div class="legend-item" style="justify-content: space-between; font-weight: 500;">
                            <span>Slow (${displayMin})</span>
                            <span>Fast (${displayMax})</span>
                        </div>
                        <div class="heatmap-bar"></div>
                        <div class="legend-item" style="margin-top: 4px;">
                            <div class="color-box" style="background-color: #555555;"></div>
                            <span>Rapid (G0)</span>
                        </div>
                    </div>
                `;
            }
        }

        function fitCameraToBounds() {
            if (bounds.minX !== Infinity) {
                const sizeX = bounds.maxX - bounds.minX;
                const sizeY = bounds.maxY - bounds.minY;
                const sizeZ = bounds.maxZ - bounds.minZ;

                document.getElementById('dim-x').innerText = `${sizeX.toFixed(2)} mm`;
                document.getElementById('dim-y').innerText = `${sizeY.toFixed(2)} mm`;
                document.getElementById('dim-z').innerText = `${sizeZ.toFixed(2)} mm`;

                const centerX = (bounds.minX + bounds.maxX) / 2;
                const centerY = (bounds.minY + bounds.maxY) / 2;
                const centerZ = (bounds.minZ + bounds.maxZ) / 2;

                const maxDim = Math.max(sizeX, sizeY, sizeZ);
                
                controls.target.set(centerX, centerY, centerZ);
                camera.position.set(centerX + maxDim * 1.5, centerY - maxDim * 1.5, centerZ + maxDim * 1.5);
                controls.update();
            }
        }

        // Initialize default stock & legend immediately
        applyStockFromUI();
        updateLegend();
    </script>
</body>
</html>
