<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D G-Code Toolpath Viewer</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            display: flex;
            height: 100vh;
            overflow: hidden;
            background-color: #1a1a1a;
            color: #e0e0e0;
        }

        #sidebar {
            width: 320px;
            background-color: #252526;
            border-right: 1px solid #3c3c3c;
            display: flex;
            flex-direction: column;
            padding: 16px;
            gap: 16px;
            z-index: 10;
        }

        h1 {
            font-size: 1.2rem;
            color: #ffffff;
            border-bottom: 1px solid #3c3c3c;
            padding-bottom: 8px;
        }

        .file-input-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #0e639c;
            color: white;
            text-align: center;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
            border: none;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #1177bb;
        }

        .stats-panel {
            background-color: #1e1e1e;
            border-radius: 4px;
            padding: 12px;
            border: 1px solid #3c3c3c;
            font-size: 0.85rem;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .stats-row {
            display: flex;
            justify-content: space-between;
        }

        .stats-value {
            color: #4ec9b0;
            font-family: monospace;
        }

        .legend {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 0.85rem;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-box {
            width: 12px;
            height: 12px;
            border-radius: 2px;
        }

        #viewport {
            flex-grow: 1;
            position: relative;
        }

        #canvas-container {
            width: 100%;
            height: 100%;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 16px 24px;
            border-radius: 8px;
            display: none;
            color: #fff;
            font-weight: 500;
        }
    </style>
    <!-- Three.js and OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="sidebar">
        <h1>G-Code Visualizer</h1>
        
        <div class="file-input-wrapper">
            <label for="gcode-file" class="btn">Open G-Code File</label>
            <input type="file" id="gcode-file" accept=".gcode,.nc,.cnc,.tap,.txt">
        </div>

        <div class="legend">
            <div class="legend-item">
                <div class="color-box" style="background-color: #ff2a2a;"></div>
                <span>Rapid Move (G0)</span>
            </div>
            <div class="legend-item">
                <div class="color-box" style="background-color: #0088ff;"></div>
                <span>Linear Cutting (G1)</span>
            </div>
            <div class="legend-item">
                <div class="color-box" style="background-color: #00ff88;"></div>
                <span>Arc Cutting (G2 / G3)</span>
            </div>
        </div>

        <div class="stats-panel">
            <div class="stats-row"><span>Status:</span> <span id="status" class="stats-value">Idle</span></div>
            <div class="stats-row"><span>Commands:</span> <span id="line-count" class="stats-value">0</span></div>
            <div class="stats-row"><span>X Size:</span> <span id="dim-x" class="stats-value">0.00 mm</span></div>
            <div class="stats-row"><span>Y Size:</span> <span id="dim-y" class="stats-value">0.00 mm</span></div>
            <div class="stats-row"><span>Z Size:</span> <span id="dim-z" class="stats-value">0.00 mm</span></div>
        </div>
    </div>

    <div id="viewport">
        <div id="canvas-container"></div>
        <div id="loading">Parsing G-code...</div>
    </div>

    <script>
        // --- 3D Scene Setup ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a1a1a);

        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 10000);
        camera.position.set(100, 100, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // Lighting & Grid Helper
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);

        const gridHelper = new THREE.GridHelper(200, 50, 0x444444, 0x222222);
        gridHelper.rotation.x = Math.PI / 2; // Orient grid along X/Y plane for standard CNC setup
        scene.add(gridHelper);

        let toolpathGroup = new THREE.Group();
        scene.add(toolpathGroup);

        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // --- G-Code Parser ---
        document.getElementById('gcode-file').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('loading').style.display = 'block';
            document.getElementById('status').innerText = 'Loading...';

            const reader = new FileReader();
            reader.onload = function(evt) {
                parseAndRenderGCode(evt.target.result);
                document.getElementById('loading').style.display = 'none';
                document.getElementById('status').innerText = 'Loaded';
            };
            reader.readAsText(file);
        });

        function parseAndRenderGCode(text) {
            // Clear prior mesh data
            while (toolpathGroup.children.length > 0) {
                const child = toolpathGroup.children[0];
                child.geometry.dispose();
                child.material.dispose();
                toolpathGroup.remove(child);
            }

            const lines = text.split('\n');
            document.getElementById('line-count').innerText = lines.length.toLocaleString();

            let currentPos = { x: 0, y: 0, z: 0 };
            let relativeMode = false;
            let currentMotion = null; // G0, G1, G2, G3

            const rapidPositions = [];
            const linearPositions = [];
            const arcPositions = [];

            let bounds = {
                minX: Infinity, maxX: -Infinity,
                minY: Infinity, maxY: -Infinity,
                minZ: Infinity, maxZ: -Infinity
            };

            function updateBounds(x, y, z) {
                bounds.minX = Math.min(bounds.minX, x);
                bounds.maxX = Math.max(bounds.maxX, x);
                bounds.minY = Math.min(bounds.minY, y);
                bounds.maxY = Math.max(bounds.maxY, y);
                bounds.minZ = Math.min(bounds.minZ, z);
                bounds.maxZ = Math.max(bounds.maxZ, z);
            }

            lines.forEach(line => {
                // Strip comments
                line = line.replace(/\(.*?\)/g, '').replace(/;.*/, '').trim().toUpperCase();
                if (!line) return;

                const tokens = line.split(/\s+/);

                let target = { ...currentPos };
                let arcIJ = { i: 0, j: 0, r: 0 };
                let hasMove = false;

                tokens.forEach(token => {
                    const cmd = token[0];
                    const val = parseFloat(token.substring(1));

                    if (cmd === 'G') {
                        if (val === 0) currentMotion = 'G0';
                        else if (val === 1) currentMotion = 'G1';
                        else if (val === 2) currentMotion = 'G2';
                        else if (val === 3) currentMotion = 'G3';
                        else if (val === 90) relativeMode = false;
                        else if (val === 91) relativeMode = true;
                    } else if (cmd === 'X') {
                        target.x = relativeMode ? currentPos.x + val : val;
                        hasMove = true;
                    } else if (cmd === 'Y') {
                        target.y = relativeMode ? currentPos.y + val : val;
                        hasMove = true;
                    } else if (cmd === 'Z') {
                        target.z = relativeMode ? currentPos.z + val : val;
                        hasMove = true;
                    } else if (cmd === 'I') arcIJ.i = val;
                    else if (cmd === 'J') arcIJ.j = val;
                    else if (cmd === 'R') arcIJ.r = val;
                });

                if (hasMove || currentMotion === 'G2' || currentMotion === 'G3') {
                    const start = [currentPos.x, currentPos.y, currentPos.z];

                    if (currentMotion === 'G0' || currentMotion === 'G1') {
                        const targetPos = [target.x, target.y, target.z];
                        const buffer = currentMotion === 'G0' ? rapidPositions : linearPositions;
                        buffer.push(...start, ...targetPos);

                        updateBounds(start[0], start[1], start[2]);
                        updateBounds(targetPos[0], targetPos[1], targetPos[2]);
                    } 
                    else if (currentMotion === 'G2' || currentMotion === 'G3') {
                        // Generate Arc Segments
                        const isCW = currentMotion === 'G2';
                        let centerX = currentPos.x + arcIJ.i;
                        let centerY = currentPos.y + arcIJ.j;

                        let startAngle = Math.atan2(currentPos.y - centerY, currentPos.x - centerX);
                        let endAngle = Math.atan2(target.y - centerY, target.x - centerX);

                        if (isCW && endAngle >= startAngle) endAngle -= 2 * Math.PI;
                        if (!isCW && endAngle <= startAngle) endAngle += 2 * Math.PI;

                        const segments = 16;
                        let prevPt = [currentPos.x, currentPos.y, currentPos.z];

                        for (let step = 1; step <= segments; step++) {
                            const t = step / segments;
                            const angle = startAngle + t * (endAngle - startAngle);
                            const interpolatedZ = currentPos.z + t * (target.z - currentPos.z);
                            const nextPt = [
                                centerX + Math.cos(angle) * Math.hypot(arcIJ.i, arcIJ.j),
                                centerY + Math.sin(angle) * Math.hypot(arcIJ.i, arcIJ.j),
                                interpolatedZ
                            ];

                            arcPositions.push(...prevPt, ...nextPt);
                            updateBounds(nextPt[0], nextPt[1], nextPt[2]);
                            prevPt = nextPt;
                        }
                    }

                    currentPos = { ...target };
                }
            });

            // --- Build Geometries ---
            function createLineMesh(positions, color) {
                if (positions.length === 0) return;
                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                const material = new THREE.LineBasicMaterial({ color: color, linewidth: 1 });
                const lineSegments = new THREE.LineSegments(geometry, material);
                toolpathGroup.add(lineSegments);
            }

            createLineMesh(rapidPositions, 0xff2a2a);   // Red
            createLineMesh(linearPositions, 0x0088ff);  // Blue
            createLineMesh(arcPositions, 0x00ff88);     // Green

            // --- Camera Fit & Dashboard Metrics Update ---
            if (bounds.minX !== Infinity) {
                const sizeX = bounds.maxX - bounds.minX;
                const sizeY = bounds.maxY - bounds.minY;
                const sizeZ = bounds.maxZ - bounds.minZ;

                document.getElementById('dim-x').innerText = `${sizeX.toFixed(2)} mm`;
                document.getElementById('dim-y').innerText = `${sizeY.toFixed(2)} mm`;
                document.getElementById('dim-z').innerText = `${sizeZ.toFixed(2)} mm`;

                const centerX = (bounds.minX + bounds.maxX) / 2;
                const centerY = (bounds.minY + bounds.maxY) / 2;
                const centerZ = (bounds.minZ + bounds.maxZ) / 2;

                const maxDim = Math.max(sizeX, sizeY, sizeZ);
                
                // Recenter scene orbit controls target to path center
                controls.target.set(centerX, centerY, centerZ);
                camera.position.set(centerX + maxDim, centerY - maxDim, centerZ + maxDim);
                controls.update();
            }
        }
    </script>
</body>
</html>
