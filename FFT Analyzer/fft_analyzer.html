<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFT Analysis Tool with Windowing</title>
    <!-- Tailwind CSS for styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Chart.js for plotting -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- PapaParse for CSV parsing -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-md p-8">
        <h1 class="text-2xl font-bold text-gray-800 mb-4">CSV FFT Analyzer with Windowing</h1>
        <p class="text-gray-600 mb-6">Upload your CSV file (Time_s, Amplitude), choose a window function to reduce spectral leakage, and analyze the resulting frequency spectrum.</p>

        <!-- Controls: File Upload & Window Selection -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-700" for="csvFile">Select CSV File</label>
                <input class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg cursor-pointer bg-gray-50 p-2 focus:outline-none" id="csvFile" type="file" accept=".csv">
            </div>
            <div>
                <label class="block mb-2 text-sm font-medium text-gray-700" for="windowType">Window Function</label>
                <select id="windowType" class="block w-full text-sm text-gray-900 border border-gray-300 rounded-lg bg-gray-50 p-2.5 focus:outline-none">
                    <option value="none">None (Rectangular)</option>
                    <option value="hann" selected>Hann</option>
                    <option value="hamming">Hamming</option>
                </select>
            </div>
        </div>

        <!-- Charts Container -->
        <div class="space-y-8">
            <div>
                <h3 class="text-lg font-semibold text-gray-700 mb-2">Time Domain (Raw Signal)</h3>
                <div class="h-64 relative">
                    <canvas id="timeChart"></canvas>
                </div>
            </div>

            <div>
                <h3 class="text-lg font-semibold text-gray-700 mb-2">Frequency Domain (FFT Magnitude)</h3>
                <div class="h-64 relative">
                    <canvas id="fftChart"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        let timeChart = null;
        let fftChart = null;
        let globalData = null; // Store loaded data globally to re-plot on window change

        // Iterative Cooley-Tukey Radix-2 FFT Implementation
        function computeFFT(real) {
            const n = real.length;
            if ((n & (n - 1)) !== 0) {
                throw new Error("FFT length must be a power of 2");
            }

            const imag = new Array(n).fill(0);
            let j = 0;
            for (let i = 0; i < n - 1; i++) {
                if (i < j) {
                    let tempR = real[i]; real[i] = real[j]; real[j] = tempR;
                    let tempI = imag[i]; imag[i] = imag[j]; imag[j] = tempI;
                }
                let k = n >> 1;
                while (k <= j) {
                    j -= k;
                    k >>= 1;
                }
                j += k;
            }

            for (let len = 2; len <= n; len <<= 1) {
                let halfLen = len >> 1;
                let angle = -2 * Math.PI / len;
                let wStepR = Math.cos(angle);
                let wStepI = Math.sin(angle);

                for (let i = 0; i < n; i += len) {
                    let wR = 1.0;
                    let wI = 0.0;
                    for (let m = 0; m < halfLen; m++) {
                        let uIdx = i + m;
                        let vIdx = i + m + halfLen;

                        let vR = real[vIdx] * wR - imag[vIdx] * wI;
                        let vI = real[vIdx] * wI + imag[vIdx] * wR;

                        real[vIdx] = real[uIdx] - vR;
                        imag[vIdx] = imag[uIdx] - vI;
                        real[uIdx] += vR;
                        imag[uIdx] += vI;

                        let nextWR = wR * wStepR - wI * wStepI;
                        let nextWI = wR * wStepI + wI * wStepR;
                        wR = nextWR;
                        wI = nextWI;
                    }
                }
            }

            const results = new Array(n);
            for (let i = 0; i < n; i++) {
                results[i] = { re: real[i], im: imag[i] };
            }
            return results;
        }

        // Apply Window Function and return windowed data + coherent gain compensation factor
        function applyWindow(signal, type) {
            const n = signal.length;
            const windowed = new Array(n);
            let sumWeights = 0;

            for (let i = 0; i < n; i++) {
                let w = 1.0;
                if (type === 'hann') {
                    w = 0.5 * (1 - Math.cos((2 * Math.PI * i) / (n - 1)));
                } else if (type === 'hamming') {
                    w = 0.54 - 0.46 * Math.cos((2 * Math.PI * i) / (n - 1));
                }
                windowed[i] = signal[i] * w;
                sumWeights += w;
            }

            // Coherent gain normalization factor so peak amplitudes stay accurate
            const coherentGain = sumWeights / n;
            return { windowedData: windowed, gain: coherentGain };
        }

        document.getElementById('csvFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            Papa.parse(file, {
                header: false,
                dynamicTyping: true,
                skipEmptyLines: true,
                complete: function(results) {
                    const rows = results.data;
                    const dataRows = rows.filter(row => typeof row[0] === 'number' && typeof row[1] === 'number');

                    if (dataRows.length < 4) {
                        alert('Not enough valid numeric rows found in the CSV.');
                        return;
                    }

                    globalData = {
                        times: dataRows.map(row => row[0]),
                        amplitudes: dataRows.map(row => row[1])
                    };

                    triggerProcessing();
                }
            });
        });

        document.getElementById('windowType').addEventListener('change', function() {
            if (globalData) {
                triggerProcessing();
            }
        });

        function triggerProcessing() {
            const dt = globalData.times[1] - globalData.times[0];
            const sampleRate = dt > 0 ? 1.0 / dt : 100;
            const windowSelection = document.getElementById('windowType').value;

            processAndPlot(globalData.times, globalData.amplitudes, sampleRate, windowSelection);
        }

        function processAndPlot(times, amplitudes, sampleRate, windowType) {
            const power = Math.floor(Math.log2(amplitudes.length));
            const n = Math.pow(2, power);
            
            const truncatedAmps = amplitudes.slice(0, n);
            const truncatedTimes = times.slice(0, n);

            // Apply selected window function
            const { windowedData, gain } = applyWindow(truncatedAmps, windowType);

            // Compute FFT on windowed signal
            const fftResult = computeFFT([...windowedData]);

            // Calculate magnitude spectrum for positive frequencies up to Nyquist
            const halfN = n / 2;
            const magnitudes = [];
            const frequencies = [];

            for (let i = 0; i < halfN; i++) {
                // Normalize by halfN and adjust for window coherent gain
                let mag = Math.sqrt(fftResult[i].re ** 2 + fftResult[i].im ** 2) / halfN;
                if (gain > 0) mag /= gain;
                magnitudes.push(mag);
                frequencies.push((i * sampleRate) / n);
            }

            // Plot Time Domain (showing windowed waveform shape)
            const timeCtx = document.getElementById('timeChart').getContext('2d');
            if (timeChart) timeChart.destroy();
            timeChart = new Chart(timeCtx, {
                type: 'line',
                data: {
                    labels: truncatedTimes.map(t => t.toFixed(2) + 's'),
                    datasets: [
                        {
                            label: 'Windowed Amplitude',
                            data: windowedData,
                            borderColor: 'rgb(59, 130, 246)',
                            borderWidth: 1.5,
                            pointRadius: 0
                        },
                        {
                            label: 'Original Signal (Reference)',
                            data: truncatedAmps,
                            borderColor: 'rgba(156, 163, 175, 0.5)',
                            borderWidth: 1,
                            borderDash: [4, 4],
                            pointRadius: 0
                        }
                    ]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    scales: {
                        x: { title: { display: true, text: 'Time (s)' } },
                        y: { title: { display: true, text: 'Amplitude' } }
                    }
                }
            });

            // Plot Frequency Domain
            const fftCtx = document.getElementById('fftChart').getContext('2d');
            if (fftChart) fftChart.destroy();
            fftChart = new Chart(fftCtx, {
                type: 'line',
                data: {
                    labels: frequencies.map(f => f.toFixed(1) + ' Hz'),
                    datasets: [{
                        label: `Magnitude Spectrum (${windowType.toUpperCase()} Window)`,
                        data: magnitudes,
                        borderColor: 'rgb(239, 68, 68)',
                        borderWidth: 1.5,
                        pointRadius: 2
                    }]
                },
                options: { 
                    responsive: true, 
                    maintainAspectRatio: false,
                    scales: {
                        x: { title: { display: true, text: 'Frequency (Hz)' } },
                        y: { title: { display: true, text: 'Magnitude' } }
                    }
                }
            });
        }
    </script>
</body>
</html>
